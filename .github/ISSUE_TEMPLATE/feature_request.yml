name: Feature request
description: Suggest an idea or a new theme
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: Describe the feature and the problem it solves.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: mockup
    attributes:
      label: Mockups or references
      description: Sketches, screenshots of similar clocks, colour palettes for theme ideas, …
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this myself
